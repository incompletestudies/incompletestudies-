<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- ─── SEO ─── -->
  {% seo %}
  
  <!-- ─── Favicon ─── -->
  <link rel="icon" type="image/x-icon" href="{{ '/favicon.ico' | relative_url }}">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ '/favicon-32x32.png' | relative_url }}">
  <link rel="icon" type="image/png" sizes="16x16" href="{{ '/favicon-16x16.png' | relative_url }}">
  <link rel="apple-touch-icon" sizes="180x180" href="{{ '/apple-touch-icon.png' | relative_url }}">
  <link rel="manifest" href="{{ '/site.webmanifest' | relative_url }}">


  <!-- ─── Preconnect for fonts ─── -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  
  <!-- ─── Google Fonts ─── -->
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;0,9..144,900;1,9..144,400;1,9..144,500;1,9..144,700;1,9..144,900&family=Literata:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Caveat:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  
  <!-- ─── CSS ─── -->
  <link rel="preload" href="{{ site.baseurl }}/assets/css/main.css" as="style">
  <link rel="stylesheet" href="{{ site.baseurl }}/assets/css/main.css">
  
  <!-- ─── Prevent FOUC (Flash of Unstyled Content) - Only on initial load ─── -->
  <style>
    /* Only hide on first load, not on navigation */
    html:not(.js-loaded) {
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    html.js-loaded {
      opacity: 1;
    }
  </style>
  
  <!-- ─── Style Guide Specific CSS (only loads on style guide) ─── -->
  {% if page.url contains 'style-guide' %}
    <style>
      .style-toc a.active {
        color: var(--gold);
        border-color: var(--gold);
      }
    </style>
  {% endif %}
</head>
<body>

  {% include header.html %}

  <main>
    {{ content }}
  </main>

  {% include footer.html %}

  <!-- ─── JavaScript ─── -->
  <script src="{{ site.baseurl }}/assets/js/main.js"></script>
  
  <!-- ─── Style Guide Specific JS ─── -->
  {% if page.url contains 'style-guide' %}
    <script src="{{ site.baseurl }}/assets/js/style-guide.js"></script>
  {% endif %}
  
  <!-- ─── FOUC Prevention - Only on first load ─── -->
  <script>
    // Check if this is the first load
    if (!sessionStorage.getItem('visited')) {
      // First visit: fade in
      document.documentElement.classList.add('js-loaded');
      sessionStorage.setItem('visited', 'true');
    } else {
      // Subsequent visits: show immediately
      document.documentElement.style.opacity = '1';
      document.documentElement.classList.add('js-loaded');
    }
  </script>

</body>
</html>
