<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title | default: site.title }}</title>
  
  <!-- ─── Fonts ─── -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;0,9..144,900;1,9..144,400;1,9..144,500;1,9..144,700;1,9..144,900&family=Literata:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Caveat:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  
  <!-- ─── CSS ─── -->
  <link rel="stylesheet" href="{{ site.baseurl }}/assets/css/main.css">
  
  <!-- ─── Style Guide Specific CSS (only loads on style guide) ─── -->
  {% if page.url contains 'style-guide' %}
    <style>
      /* Additional style guide specific styles if needed */
      .style-toc a.active {
        color: var(--gold);
        border-color: var(--gold);
      }
    </style>
  {% endif %}
</head>
<body>

  {% include header.html %}

  <main>
    {{ content }}
  </main>

  {% include footer.html %}

  <!-- ─── JavaScript ─── -->
  <script src="{{ site.baseurl }}/assets/js/main.js"></script>
  
  <!-- ─── Style Guide Specific JS ─── -->
  {% if page.url contains 'style-guide' %}
    <script src="{{ site.baseurl }}/assets/js/style-guide.js"></script>
  {% endif %}

</body>
</html>
