<header class="topbar">
  <div class="topbar-inner">
    
    <!-- ─── Left: Hamburger (mobile only) + Logo ─── -->
    <div class="topbar-left">
      <button class="topbar-menu-toggle" aria-label="Toggle menu" onclick="toggleMenu()">
        <span></span>
        <span></span>
        <span></span>
      </button>
      
      <div class="topbar-mark" onclick="location.href='{{ site.baseurl }}/'" role="link" tabindex="0" aria-label="Journal of Incomplete Studies — Home" title="Journal of Incomplete Studies">
        <div class="topbar-mark-pulse"></div>
        <span class="topbar-mark-text">J.I.S.</span>
      </div>
    </div>
    
    <!-- ─── Desktop Navigation ─── -->
    {% include navigation.html %}
    
    <!-- ─── Right Side ─── -->
    <div class="topbar-right">
      <span>Season {{ site.current_season }}</span>
      <span class="topbar-version">{{ site.version }}</span>
    </div>
    
  </div>
  
  <!-- ─── Mobile Navigation ─── -->
  <div class="topbar-mobile-menu" id="mobileMenu">
    <ul>
      {% for item in site.data.navigation %}
        <li>
          <a href="{{ site.baseurl }}{{ item.url }}" 
             {% if page.url == item.url %}class="active" aria-current="page"{% endif %}
             onclick="closeMenu()">
            {{ item.title }}
          </a>
        </li>
      {% endfor %}
    </ul>
  </div>
</header>

<script>
  function toggleMenu() {
    const menu = document.getElementById('mobileMenu');
    menu.classList.toggle('open');
  }
  
  function closeMenu() {
    document.getElementById('mobileMenu').classList.remove('open');
  }
</script>

<style>
  /* ─── Topbar ─── */
  .topbar {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 100;
    background: var(--void);
    border-bottom: 1px solid var(--rule);
    padding: 0 1.5rem;
    height: 48px;
    display: flex;
    align-items: center;
    width: 100%;
    box-sizing: border-box;
  }

  .topbar-inner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    max-width: 100%;
    height: 48px;
    gap: 0.5rem;
  }

  /* ─── Left Section ─── */
  .topbar-left {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    flex-shrink: 0;
  }

  /* ─── Hamburger Menu (hidden on desktop) ─── */
  .topbar-menu-toggle {
    display: none;
    flex-direction: column;
    gap: 4px;
    background: none;
    border: none;
    cursor: pointer;
    padding: 0.3rem;
    flex-shrink: 0;
  }

  .topbar-menu-toggle span {
    display: block;
    width: 20px;
    height: 2px;
    background: var(--muted);
    transition: all 0.3s ease;
    border-radius: 2px;
  }

  .topbar-menu-toggle:hover span {
    background: var(--cream);
  }

  /* ─── Logo ─── */
  .topbar-mark {
    display: flex;
    align-items: center;
    gap: 0.7rem;
    padding: 0 1.5rem 0 0;
    border-right: 1px solid var(--rule);
    cursor: pointer;
    flex-shrink: 0;
  }

  .topbar-mark-pulse {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--sage);
    animation: pulse 2.8s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.3; transform: scale(0.85); }
  }

  .topbar-mark-text {
    font-family: var(--mono);
    font-size: 9px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--muted);
  }

  /* ─── Desktop Navigation ─── */
  .topbar-nav {
    display: flex;
    align-items: stretch;
    flex: 1;
    overflow-x: auto;
    height: 100%;
  }

  .topbar-nav::-webkit-scrollbar {
    display: none;
  }

  .nav-tab {
    font-family: var(--mono);
    font-size: 9px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--mid);
    padding: 0 1.2rem;
    background: none;
    border: none;
    border-right: 1px solid var(--rule);
    cursor: pointer;
    white-space: nowrap;
    transition: color 0.15s, background 0.15s;
    display: flex;
    align-items: center;
    height: 100%;
  }

  .nav-tab:hover {
    color: var(--pale);
    background: var(--void2);
  }

  .nav-tab.active {
    color: var(--cream);
    background: var(--void2);
    border-bottom: 1px solid var(--gold-dim);
  }

  /* ─── Right Side ─── */
  .topbar-right {
    display: flex;
    align-items: center;
    padding: 0 0 0 1.5rem;
    border-left: 1px solid var(--rule);
    gap: 1.5rem;
    font-family: var(--mono);
    font-size: 8.5px;
    letter-spacing: 0.1em;
    color: var(--mid);
    flex-shrink: 0;
  }

  .topbar-version {
    color: var(--ash);
    font-size: 8px;
  }

  /* ─── Mobile Menu ─── */
  .topbar-mobile-menu {
    display: none;
    position: absolute;
    top: 48px;
    left: 0;
    right: 0;
    background: var(--void);
    border-bottom: 1px solid var(--rule);
    padding: 1rem 1.5rem;
    z-index: 999;
    backdrop-filter: blur(10px);
  }

  .topbar-mobile-menu.open {
    display: block;
  }

  .topbar-mobile-menu ul {
    list-style: none;
    padding: 0;
    margin: 0;
  }

  .topbar-mobile-menu ul li {
    border-bottom: 1px solid var(--rule);
  }

  .topbar-mobile-menu ul li:last-child {
    border-bottom: none;
  }

  .topbar-mobile-menu ul li a {
    display: block;
    padding: 0.75rem 0;
    font-family: var(--mono);
    font-size: 9px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    text-decoration: none;
    transition: color 0.2s;
  }

  .topbar-mobile-menu ul li a:hover {
    color: var(--cream);
  }

  .topbar-mobile-menu ul li a.active {
    color: var(--gold);
  }

  /* ─── Responsive ─── */
  @media (max-width: 768px) {
    .topbar-menu-toggle {
      display: flex;
    }

    .topbar-nav {
      display: none !important;
    }

    .topbar-mark {
      padding: 0;
      border-right: none;
    }

    .topbar-right {
      padding: 0;
      border-left: none;
      gap: 0.5rem;
      font-size: 7px;
    }

    .topbar-version {
      display: none;
    }
  }

  @media (max-width: 480px) {
    .topbar-right span:first-child {
      font-size: 6px;
    }

    .topbar-mark-text {
      font-size: 8px;
    }
  }
</style>
