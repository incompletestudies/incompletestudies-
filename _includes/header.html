<header class="topbar">
  
    
  <!-- ─── Left: Hamburger (mobile only) + Logo ─── -->
  <div class="topbar-left">
    <button class="topbar-menu-toggle" aria-label="Toggle menu" onclick="toggleMenu()">
      <span></span>
      <span></span>
      <span></span>
    </button>
    
    <div class="topbar-mark" onclick="location.href='{{ site.baseurl }}/'" role="link" tabindex="0" aria-label="Journal of Incomplete Studies — Home" title="Journal of Incomplete Studies">
      <span class="brand">The Journal of<br>Incomplete Studies</span>
    </div>
  </div>
  
  <!-- ─── Desktop Navigation ─── -->
  {% include navigation.html %}
  
  <!-- ─── Right Side ─── -->
  <div class="topbar-right">
    <span class="search-trigger" onclick="openSearch()" role="button" tabindex="0" aria-label="Search">⌕</span>
  </div>
    
  
  
  <!-- ─── Mobile Navigation ─── -->
  <div class="topbar-mobile-menu" id="mobileMenu">
    <ul>
      {% for item in site.data.navigation %}
        <li>
          <a href="{{ site.baseurl }}{{ item.url }}" 
             {% if page.url == item.url %}class="active" aria-current="page"{% endif %}
             onclick="closeMenu()">
            {{ item.title }}
          </a>
        </li>
      {% endfor %}
    </ul>
  </div>
</header>

<script>
  // ─── Mobile menu ───
  function toggleMenu() {
    document.getElementById('mobileMenu').classList.toggle('open');
  }
  function closeMenu() {
    document.getElementById('mobileMenu').classList.remove('open');
  }

  // ─── Search ───
  function openSearch() {
    document.getElementById('searchbox').style.display = 'block';
    document.getElementById('searchinput').focus();
    filterResults('');   // ← show defaults immediately
  }

  function closeSearch() {
    document.getElementById('searchbox').style.display = 'none';
    document.getElementById('searchinput').value = '';
    document.getElementById('results').innerHTML = '';
  }

  // Cached search index
  let searchIndex = null;

  async function loadIndex() {
    if (searchIndex) return searchIndex;
    const res = await fetch('{{ site.baseurl }}/search.json');
    searchIndex = await res.json();
    return searchIndex;
  }

  async function filterResults(query) {
    const results = document.getElementById('results');
    const index = await loadIndex();
    const q = query.trim().toLowerCase();

    // ─── Empty query: show curated defaults ───
    if (!q) {
      results.innerHTML = renderDefaults(index);
      return;
    }

    // ─── Real search ───
    const matches = index
      .map(item => {
        const title = (item.title || '').toLowerCase();
        const content = (item.content || '').toLowerCase();
        const titleHit = title.includes(q);
        const contentHit = content.includes(q);
        if (!titleHit && !contentHit) return null;
        return { ...item, score: titleHit ? 2 : 1 };
      })
      .filter(Boolean)
      .sort((a, b) => b.score - a.score)
      .slice(0, 30);

    if (!matches.length) {
      results.innerHTML = `<div class="result" style="color:#777">Nothing found for "${query}"</div>`;
      return;
    }

    results.innerHTML = matches.map(renderResult).join('');
  }

  // ─── Shared renderer ───
  function renderResult(m) {
    return `
      <a class="result" href="${m.url}" onclick="closeSearch()">
        ${m.title}<span style="color:#777"> / ${(m.category || '').toLowerCase()}</span>
      </a>
    `;
  }

  // ─── Curated defaults when nothing typed yet ───
  function renderDefaults(index) {
    // Pick a few items per category
    const pick = (cat, n) =>
      index.filter(i => (i.category || '').toLowerCase() === cat.toLowerCase()).slice(0, n);

    const featured = [
      ...pick('Season', 1),
      ...pick('Project', 4),
      ...pick('Post', 3),
      ...pick('Author', 2),
      ...pick('Page', 2),
    ].slice(0, 10);

    if (!featured.length) {
      // Fallback: just show the first 8 items
      return index.slice(0, 8).map(renderResult).join('');
    }

    return `
      <div class="results-label">From the record</div>
      ${featured.map(renderResult).join('')}
    `;
  }

  function snippet(content, q) {
    const i = content.indexOf(q);
    if (i < 0) return '';
    const start = Math.max(0, i - 40);
    const end = Math.min(content.length, i + q.length + 60);
    return (start > 0 ? '…' : '') + content.slice(start, end) + (end < content.length ? '…' : '');
  }

  // Close on ESC
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeSearch();
  });
</script>

<style>
  
  /* ============================================================
     1. SEARCH OVERLAY
     ============================================================ */
  #searchbox {
    position: fixed;
    inset: 0;
    background: rgba(17, 17, 15, .97);
    color: var(--paper);
    z-index: 30;
    padding: 9vh 10vw;
    display: none;
  }
  .close {
    position: absolute;
    right: 30px;
    top: 25px;
    font: 12px var(--mono);
    cursor: pointer;
  }
  .searchinput {
    font: clamp(40px, 7vw, 90px) var(--serif);
    background: none;
    border: 0;
    border-bottom: 1px solid #555;
    color: var(--paper);
    width: 100%;
    outline: none;
  }
  .searchresults {
    margin-top: 35px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0 35px;
  }
  .results-label {
    grid-column: 1 / -1;
    font: 9px var(--mono);
    letter-spacing: .16em;
    text-transform: uppercase;
    color: #888;
    padding: 0 0 10px;
    border-bottom: 1px solid #333;
    margin-bottom: 4px;
  }
  .result {
    display: block;
    padding: 14px 0;
    border-bottom: 1px solid #444;
    font: 12px var(--mono);
    color: var(--paper);
    text-decoration: none;
    cursor: pointer;
    transition: opacity .15s, padding-left .15s;
  }
  .result:hover {
    opacity: .75;
    padding-left: 6px;
  }

  /* ============================================================
     2. TOPBAR — STRUCTURE
     ============================================================ */
  .topbar {
    position: sticky;
    top: 0;
    z-index: 10;
    display: grid;
    grid-template-columns: 220px 1fr auto;
    align-items: stretch;
    padding: 16px 26px ;
    border-bottom: 1px solid var(--line);
    background: rgba(238, 234, 223, .95);
    backdrop-filter: blur(9px);
    transition: background-color .3s ease, border-color .3s ease;
  }

  .topbar-left {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    flex-shrink: 0;
  }

  .topbar-right {
    display: flex;
    align-items: center;
    padding: 0 0 0 1.5rem;
    gap: 1.5rem;
    font-family: var(--mono);
    font-size: 8.5px;
    letter-spacing: 0.1em;
    color: var(--mid);
    flex-shrink: 0;
  }

  /* ============================================================
     3. TOPBAR — BRAND
     ============================================================ */
  .topbar-mark {
    display: flex;
    align-items: center;
    gap: 0.7rem;
    padding: 0 1.5rem 0 0;
    cursor: pointer;
    flex-shrink: 0;
  }

  .brand {
    font: 18px/1 var(--serif);
    cursor: pointer;
  }

  .topbar-mark-text {
    font-family: var(--mono);
    font-size: 9px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--muted);
  }

  /* ============================================================
     4. TOPBAR — DESKTOP NAV
     ============================================================ */
  .topbar-nav {
    display: flex;
    align-items: stretch;
    flex: 1;
    overflow-x: auto;
    height: 100%;
  }

  .topbar-nav::-webkit-scrollbar {
    display: none;
  }

  .nav-tab {
    position: relative;
    font-family: var(--mono);
    font-size: 9px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--mid);
    padding: 0 1.2rem;
    background: none;
    border: none;
    cursor: pointer;
    white-space: nowrap;
    transition: color 0.15s;
    display: flex;
    align-items: center;
    height: 100%;
  }

  .nav-tab:hover {
    color: var(--ink);
    background: none;
  }

  .nav-tab.active {
    color: var(--ink);
    background: none;
  }

  .nav-tab.active::after {
    content: "";
    position: absolute;
    left: 1.2rem;
    right: 1.2rem;
    bottom: 0;
    height: 2px;
    background: var(--red);
  }

  /* ============================================================
     5. TOPBAR — SEARCH TRIGGER
     ============================================================ */
  .search-trigger {
    font: 16px var(--mono);
    cursor: pointer;
    color: var(--mid);
    padding: 0 0.5rem;
  }

  .search-trigger:hover {
    color: var(--ink);
  }

  /* ============================================================
     6. TOPBAR — HAMBURGER (mobile)
     ============================================================ */
  .topbar-menu-toggle {
    display: none;
    flex-direction: column;
    gap: 4px;
    background: none;
    border: none;
    cursor: pointer;
    padding: 0.3rem;
    flex-shrink: 0;
  }

  .topbar-menu-toggle span {
    display: block;
    width: 20px;
    height: 2px;
    background: var(--muted);
    transition: all 0.3s ease;
    border-radius: 2px;
  }

  .topbar-menu-toggle:hover span {
    background: var(--ink);
  }

  /* ============================================================
     7. TOPBAR — MOBILE MENU
     ============================================================ */
  .topbar-mobile-menu {
    display: none;
    position: absolute;
    top: 100%;   /* ← sit right below the header */
    left: 0;
    right: 0;
    background: var(--paper);
    border-bottom: 1px solid var(--rule);
    padding: 1rem 1.5rem;
    z-index: 999;
  }

  .topbar-mobile-menu.open {
    display: block;
  }

  .topbar-mobile-menu ul {
    list-style: none;
    padding: 0;
    margin: 0;
  }

  .topbar-mobile-menu ul li {
    border-bottom: 1px solid var(--rule);
  }

  .topbar-mobile-menu ul li:last-child {
    border-bottom: none;
  }

  .topbar-mobile-menu ul li a {
    display: block;
    padding: 0.75rem 0;
    font-family: var(--mono);
    font-size: 9px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    text-decoration: none;
    transition: color 0.2s;
  }

  .topbar-mobile-menu ul li a:hover {
    color: var(--ink);
  }

  .topbar-mobile-menu ul li a.active {
    color: var(--red);
  }

  /* ============================================================
     8. RESPONSIVE
     ============================================================ */
  @media (max-width: 768px) {
    .topbar-menu-toggle { display: flex; }
    .topbar-nav { display: none !important; }
    .topbar-mark { padding: 0; border-right: none; }
    .topbar-right {
      padding: 0;
      border-left: none;
      gap: 0.5rem;
      font-size: 7px;
    }
    .topbar-version { display: none; }
  }

  @media (max-width: 480px) {
    .topbar-right span:first-child { font-size: 6px; }
    .topbar-mark-text { font-size: 8px; }
  }
</style>
