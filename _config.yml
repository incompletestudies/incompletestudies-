# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.
#
# If you need help with YAML syntax, here are some quick references for you:
# https://learn-the-web.algonquindesign.ca/topics/markdown-yaml-cheat-sheet/#yaml
# https://learnxinyminutes.com/docs/yaml/
#
# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.

title: Journal of Incomplete Studies
email: incompletestudies@proton.me
description: >- # this means to ignore newlines until "baseurl:"
  Write an awesome description for your new site here. You can edit this
  line in _config.yml. It will appear in your document head meta (for
  Google search results) and in your feed.xml site description.
baseurl: "/incompletestudies-"  # Your repository name with the hyphen
url: "https://incompletestudies.github.io"
twitter_username: jekyllrb
github_username:  incompletestudies

# Build settings
theme: minima
plugins:
  - jekyll-feed


# Markdown settings
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: true
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  parse_block_html: false      # ← CHANGE to false
  parse_span_html: false       # ← CHANGE to false
  footnotes: true
  enable_coderay: false
  syntax_highlighter: none
  transliterated_header_ids: true
  html_to_native: false        # ← ADD THIS


# ... other settings ...
collections:
  people:
    output: true
    permalink: /authors/:slug/
  projects:
    output: true
    permalink: /projects/:slug/
  seasons:
    output: true
    permalink: /seasons/:slug/

# Exclude from processing.
# The following items will not be processed, by default.
# Any item listed under the `exclude:` key here will be automatically added to
# the internal "default list".
#
# Excluded items can be processed by explicitly listing the directories or
# their entries' file path in the `include:` list.
#

exclude:
  - drafts/
  - metadata/
  - scripts/
  - vendor/
  - Gemfile
  - Gemfile.lock
  - README.md
  - node_modules/
  - .git/
  - .gitignore
  - _site/

#   - .sass-cache/
#   - .jekyll-cache/
#   - gemfiles/
#   - Gemfile
#   - Gemfile.lock
#   - node_modules/
#   - vendor/bundle/
#   - vendor/cache/
#   - vendor/gems/
#   - vendor/ruby/



# New design settings
current_season: "01"
version: "v2.1.4"
footer_left: "The Unfinished Archive · Serial Research Publication · Est. 2026"
footer_right: "v2.1.4 · 2026-07-16 · Season 01 ongoing"

# Project data now lives in the `_projects` collection (see /_projects/*.md)
# and is resolved via Liquid wherever it is needed, instead of being
# duplicated here.

# Navigation
# Canonical navigation lives in _data/navigation.yml (used by _includes/navigation.html
# via site.data.navigation). This duplicate site.navigation key previously drifted out
# of sync with it (e.g. "Authors" was listed here but missing from _data/navigation.yml,
# leaving /authors/ unreachable from the nav) and was never read by any template, so it
# has been removed to keep a single source of truth for the top nav.