# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.
#
# If you need help with YAML syntax, here are some quick references for you:
# https://learn-the-web.algonquindesign.ca/topics/markdown-yaml-cheat-sheet/#yaml
# https://learnxinyminutes.com/docs/yaml/
#
# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.

title: Journal of Incomplete Studies
email: incompletestudies@proton.me
description: >- # this means to ignore newlines until "baseurl:"
  An open-access online publication for research that remains incomplete — work in progress, provisional arguments, uncertain findings, and unresolved questions.
baseurl: "/incompletestudies-"  # Your repository name with the hyphen
url: "https://incompletestudies.github.io"
github_username:  incompletestudies

# SEO: Author information
author:
  name: "Journal of Incomplete Studies"

# SEO: Social media (optional)
social:
  name: "Journal of Incomplete Studies"
  links:
    - "https://github.com/incompletestudies"

# SEO: Default image for social sharing (create this image)
og_image: "/assets/images/logo/logo_1200x630.jpg"  # 1200x630px recommended

# Build settings
theme: minima
plugins:
  - jekyll-feed
  - jekyll-seo-tag    # ← ADD THIS
  - jekyll-sitemap    # ← ADD THIS

# Markdown settings
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: true
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  parse_block_html: false
  parse_span_html: false
  footnotes: true
  enable_coderay: false
  syntax_highlighter: none
  transliterated_header_ids: true
  html_to_native: false

# Collections
collections:
  people:
    output: true
    permalink: /authors/:slug/
  projects:
    output: true
    permalink: /projects/:slug/
  seasons:
    output: true
    permalink: /seasons/:slug/

# ─── DEFAULT FRONT MATTER FOR COLLECTIONS ───
defaults:
  # Fallback for all pages
  - scope:
      path: ""
    values:
      description: "An open-access online publication for research that remains incomplete — work in progress, provisional arguments, uncertain findings, and unresolved questions."
      image: "/assets/images/logo/logo_1200x630.jpg"

  # ─── PAGES IN pages/ (NO type: needed) ───

  # Projects collection index (/projects/)
  - scope:
      path: "pages/projects.md"
    values:
      layout: "default"
      description: "Each project in The Journal of Incomplete Studies represents a sustained inquiry — research that unfolds over time through multiple installments."
      # image: "/assets/images/og-projects.jpg"

  # Seasons collection index (/seasons/)
  - scope:
      path: "pages/seasons.md"
    values:
      layout: "default"
      description: "A season brings together a cohort of researchers exploring incompletion in their work."
      # image: "/assets/images/og-seasons.jpg"

  # People collection index (/authors/)
  - scope:
      path: "pages/writers.md"
    values:
      layout: "default"
      description: "Meet the researchers, writers, and thinkers whose work appears in The Journal of Incomplete Studies."
      # image: "/assets/images/og-authors.jpg"

  # ─── COLLECTION ITEMS (type: REQUIRED) ───

  # Individual projects (_projects/*.md)
  - scope:
      path: "_projects"
      type: "projects"
    values:
      layout: "project"           # ← Fixed: just "project", not "_layouts/project.html"

  # Individual seasons (_seasons/*.md)
  - scope:
      path: "_seasons"
      type: "seasons"
    values:
      layout: "season"            # ← Fixed: just "season", not "_layouts/season.html"

  # Individual authors (_people/*.md)
  - scope:
      path: "_people"
      type: "people"
    values:
      layout: "person"            # ← Fixed: just "person" (since you're using person.html)

  # ─── INSTALLMENTS (posts in _posts/) ───

  # All posts (installments)
  - scope:
      path: "_posts"
      type: "posts"
    values:
      layout: "post"              # ← Fixed: just "post", not "_layouts/post.html"
      description: "An installment from The Journal of Incomplete Studies — research in progress, provisional arguments, and unresolved questions."
      # image: "/assets/images/og-installment-default.jpg"
    
# Exclude from processing.
exclude:
  - drafts/
  - metadata/
  - scripts/
  - vendor/
  - Gemfile
  - Gemfile.lock
  - README.md
  - node_modules/
  - .git/
  - .gitignore
  - _site/

# New design settings
current_season: "01"
version: "v2.1.4"
footer_left: "The Unfinished Archive · Serial Research Publication · Est. 2026"
footer_right: "v2.1.4 · 2026-07-16 · Season 01 ongoing"